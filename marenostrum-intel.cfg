# Cactus configuration for Mare Nostrum 5 using Intel compilers

# Modules to load before running/compiling:
# $ module load impi/2021.12
# $ module load intel/2024.1
# $ module load hdf5/1.10.11-intel24.0-impi21.11
# $ module load zlib/1.3.1
# $ module load szip/2.1.1
# $ module load boost/1.88.0-intel-impi
# $ module load lapack/3.12.1-intel
# $ module load fftw/3.3.10
# $ module load papi/7.0.1

# run these after loading module because of reasons
# $ unset MPI
# $ unset MPI_DIR

## Preprocessors and Compilers
CPP = cpp
FPP = cpp
CC  = mpiicc
CXX = mpiicpc
F77 = mpiifort
F90 = mpiifort

## Default flags
CPPFLAGS = -g -DOMPI_SKIP_MPICXX
FPPFLAGS = -g -traditional
CFLAGS   = -g            -debug all -xhost        -std=gnu17   -diag-disable=10441
CXXFLAGS = -g -traceback -debug all -xhost -align -std=gnu++17 -diag-disable=10441
F77FLAGS = -g -traceback -debug all -xhost -align -pad -safe-cray-ptr
F90FLAGS = -g -traceback -debug all -xhost -align -pad -safe-cray-ptr

## Misc
LDFLAGS = -rdynamic -xCORE-AVX512 -lquadmath

C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

VECTORISE                = yes
VECTORISE_ALIGNED_ARRAYS = no
VECTORISE_INLINE         = no

## Debug flags
DEBUG           = no
CPP_DEBUG_FLAGS = -DCARPET_DEBUG
FPP_DEBUG_FLAGS = -DCARPET_DEBUG
C_DEBUG_FLAGS   = -O0
CXX_DEBUG_FLAGS = -O0
F77_DEBUG_FLAGS = -O0 -check bounds -check format
F90_DEBUG_FLAGS = -O0 -check bounds -check format

## Optimization flags
OPTIMISE           = yes
CPP_OPTIMISE_FLAGS = # -DCARPET_OPTIMISE -DNDEBUG
FPP_OPTIMISE_FLAGS = # -DCARPET_OPTIMISE -DNDEBUG
C_OPTIMISE_FLAGS   = -O2
CXX_OPTIMISE_FLAGS = -O2
F77_OPTIMISE_FLAGS = -O2
F90_OPTIMISE_FLAGS = -O2

CPP_NO_OPTIMISE_FLAGS  =
FPP_NO_OPTIMISE_FLAGS  =
C_NO_OPTIMISE_FLAGS    = -O0
CXX_NO_OPTIMISE_FLAGS  = -O0
CUCC_NO_OPTIMISE_FLAGS =
F77_NO_OPTIMISE_FLAGS  = -O0
F90_NO_OPTIMISE_FLAGS  = -O0

## Code profiling flags
PROFILE           = no
CPP_PROFILE_FLAGS =
FPP_PROFILE_FLAGS =
C_PROFILE_FLAGS   = -pg
CXX_PROFILE_FLAGS = -pg
F77_PROFILE_FLAGS = -pg
F90_PROFILE_FLAGS = -pg

## OpenMP
OPENMP           = yes
CPP_OPENMP_FLAGS = -fopenmp
FPP_OPENMP_FLAGS = -fopenmp
C_OPENMP_FLAGS   = -fopenmp
CXX_OPENMP_FLAGS = -fopenmp
F77_OPENMP_FLAGS = -fopenmp
F90_OPENMP_FLAGS = -fopenmp

## Warning flags
WARN           = yes
CPP_WARN_FLAGS =
FPP_WARN_FLAGS =
C_WARN_FLAGS   =
CXX_WARN_FLAGS =
F77_WARN_FLAGS =
F90_WARN_FLAGS =

## Libraries location
MPI_DIR        = /gpfs/apps/MN5/GPP/ONEAPI/2023.2.0/mpi/2021.10.0
MPI_LIBS       = mpi
HDF5_DIR       = /apps/GPP/HDF5/1.10.11/INTEL24.1/IMPI21.12/
LAPACK_DIR     = /apps/GPP/LAPACK/3.12.1/INTEL/
GSL_DIR        = BUILD
BLAS_DIR       = NO_BUILD
OPENBLAS_DIR   = NO_BUILD
HWLOC_DIR      = NO_BUILD
PTHREADS_DIR   = NO_BUILD
ZLIB_DIR       = /apps/GPP/ZLIB/1.3.1/INTEL
LIBZ_DIR       = /apps/GPP/ZLIB/1.3.1/INTEL/lib
LIBSZ_DIR      = /apps/GPP/SZIP/2.1.1/INTEL/lib
BOOST_DIR      = /apps/GPP/BOOST/1.88.0/INTEL/IMPI/
FFTW3_DIR      = /apps/GPP/FFTW/3.3.10/INTEL/IMPI/
PAPI_DIR       = /apps/GPP/PAPI/7.1.0/GCC
